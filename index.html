<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f1">
  <meta name="description" content="Three stops. One very special plastic bag. Counting down until we're together.">
  <title>On my way to you ♡</title>
  <link rel="icon" href="assets/heart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="trip.js" defer></script>
  <script src="script.js" defer></script>
  <script src="fold.js" defer></script>
</head>
<body>
  <main>
    <section class="countdown" aria-label="Countdown until we are together">
      <div class="clock" role="timer" aria-live="off" aria-label="Time remaining">
        <div><span id="hours">—</span><small>HOURS</small></div><b>:</b>
        <div><span id="minutes">—</span><small>MINUTES</small></div><b>:</b>
        <div><span id="seconds">—</span><small>SECONDS</small></div>
      </div>
    </section>
    <section class="postcard" aria-label="Our travel map">
      <div class="map-wrap">
        <svg class="map" viewBox="0 0 760 420" role="group" aria-labelledby="map-title map-description">
          <title id="map-title">From Wilmington to Palo Alto, via Chicago</title>
          <desc id="map-description">A route connects Wilmington, North Carolina to Chicago, Illinois, then Palo Alto, California. A blue plastic bag waits in Palo Alto. The middle of the map is labeled middle states, with a cactus and tumbleweed.</desc>
          <defs>
            <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#826a5e" flood-opacity=".15"/></filter>
            <linearGradient id="bag-blue" x1="0" x2="1" y2="1"><stop stop-color="#60c1e8"/><stop offset="1" stop-color="#208bbc"/></linearGradient>
          </defs>
          <g id="map-paper">
          <image href="assets/us-map.svg" width="760" height="420"/>
          <path id="route-nc" class="route" d="M 590 262 Q 580 165 473 147"/>
          <path id="route-ca" class="route" d="M 473 147 Q 260 80 59 213"/>
          <g class="middel-states" transform="translate(0 -12)" aria-label="middle states, with a cactus and tumbleweed">
            <text x="303" y="222" text-anchor="middle" class="middel-label">middle states</text>
            <g transform="translate(253 246)" aria-hidden="true">
              <ellipse cx="0" cy="48" rx="21" ry="3" fill="#d9c9af" opacity=".5"/>
              <path d="M0 44 V0 M0 25 H-14 Q-20 25 -20 19 V10 M0 15 H13 Q19 15 19 9 V2" fill="none" stroke="#819473" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M-2 40 V0 M-19 12 V19 Q-19 23 -14 23 M2 13 H13 Q17 13 17 8 V3" fill="none" stroke="#b5c0a0" stroke-width="2" stroke-linecap="round"/>
              <path d="M-8 7 H-5 M5 32 H8 M-26 15 H-23 M24 5 H27" stroke="#657b59" stroke-width="1.5" stroke-linecap="round"/>
            </g>
            <g transform="translate(341 273)" aria-hidden="true">
              <ellipse cy="22" rx="29" ry="3" fill="#d9c9af" opacity=".5"/>
              <g fill="none" stroke="#b49a76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-24 -4 L-17 -17 L-4 -23 L10 -20 L22 -10 L25 4 L17 17 L2 22 L-14 17 L-24 7 Z"/>
                <ellipse rx="15" ry="21" transform="rotate(30)"/><ellipse rx="21" ry="11" transform="rotate(-26)"/>
                <path d="M-19 -13 L12 15 L7 -17 L-14 13 L22 -5 L-21 -2 L3 20 L-3 -21 L18 10 L-16 16 L14 -16 M-28 4 L-12 1 M17 -13 L25 -20 M5 18 L10 25 M-14 -17 L-20 -23 M23 5 L30 9"/>
              </g>
            </g>
          </g>
          </g>
          <g class="fold-toggle" role="button" tabindex="0" aria-label="Fold away the middle states" aria-pressed="false"><rect class="fold-hit-area" x="170" y="90" width="370" height="260" rx="12"/><text class="fold-hint" x="303" y="313" text-anchor="middle" aria-hidden="true">Remove them ✂️</text></g>
          <g class="destination" transform="translate(59 213)">
            <circle class="pin-halo" r="15"/><circle class="pin" r="5"/>
            <g class="bag bounce-target" role="button" tabindex="0" aria-label="Bounce the plastic bag" transform="translate(-25 -81)" filter="url(#shadow)">
              <path d="M5 29 L9 2 Q11 -3 17 1 L20 25 Q27 30 34 25 L38 1 Q44 -3 47 2 L51 29 L53 66 Q53 75 43 77 L12 77 Q2 75 2 66 Z" fill="url(#bag-blue)"/>
              <path d="M11 7 L14 28 M43 7 L40 28 M9 37 L15 67 M44 39 L39 72 M20 31 L24 40 M29 60 L25 74" fill="none" stroke="#b0e2f2" stroke-width="2" opacity=".55"/>
              <circle cx="20" cy="47" r="2.4" fill="#20566c"/><circle cx="35" cy="47" r="2.4" fill="#20566c"/><path d="M23 55 Q27.5 60 32 55" fill="none" stroke="#20566c" stroke-width="2" stroke-linecap="round"/><ellipse cx="15" cy="53" rx="4" ry="2" fill="#f7b6bd"/><ellipse cx="40" cy="53" rx="4" ry="2" fill="#f7b6bd"/>
            </g>
            <text x="-33" y="-93" class="tiny-heart">♡</text><text x="39" y="-67" class="tiny-heart">♥</text>
            <text y="30" class="map-label" text-anchor="middle" id="ca-label">Palo Alto, CA</text>
          </g>
          <g id="chicago-pin" transform="translate(473 147)"><circle class="pin-halo" r="13"/><circle class="pin" r="5"/><text x="5" y="30" class="map-label" text-anchor="middle">Chicago</text></g>
          <g id="nc-pin" transform="translate(590 262)"><circle class="pin-halo" r="13"/><circle class="pin" r="5"/><text x="-5" y="31" class="map-label" text-anchor="middle" id="nc-label">Wilmington, NC</text></g>
          <g id="traveler" transform="translate(590 262)" filter="url(#shadow)"><g class="traveler-bob bounce-target" role="button" tabindex="0" aria-label="Bounce the smiley"><g class="traveler-plane" aria-hidden="true"><path d="M-43 0 Q-47 -4 -39 -7 L-14 -10 L2 -32 L13 -32 L5 -10 L29 -9 L36 -19 L43 -19 L40 -3 Q40 3 30 4 L4 4 L13 23 L3 23 L-15 5 L-37 5 Z" fill="#fffdf9" stroke="#bb7c83" stroke-width="2"/><path d="M-36 -3 H-21" stroke="#88b6ca" stroke-width="3" stroke-linecap="round"/></g><rect class="traveler-card" x="-29" y="-70" width="58" height="49" rx="17" fill="#fffdf9" stroke="#e9dcd2"/><path class="traveler-card" d="M-6 -21 L0 -14 L6 -21" fill="#fffdf9"/><text y="-36" text-anchor="middle" font-size="27" id="traveler-emoji">🥹</text><text x="0" y="-77" text-anchor="middle" class="me-label">ME</text></g></g>
        </svg>
      </div>
      <div class="map-bottom"><span id="location-status" role="status"><span class="status-dot"></span> Currently in Wilmington</span><span class="map-key"><i></i> a slightly unnecessary detour</span></div>
    </section>
    <section class="itinerary" aria-label="Trip itinerary">
      <article id="stop-nc" class="stop"><span class="stop-number">01</span><div><p class="stop-date">THE STARTING POINT</p><h3>Wilmington, NC</h3></div><span class="stop-state">HERE NOW</span></article>
      <article id="stop-chicago" class="stop"><span class="stop-number">02</span><div><p class="stop-date">MON, SEP 21 · 3 PM ET</p><h3>Chicago, IL</h3></div><span class="stop-state">UP NEXT</span></article>
      <article id="stop-ca" class="stop"><span class="stop-number">03</span><div><p class="stop-date">FRI, SEP 25 · 6 PM PT</p><h3>You!! <span>♡</span></h3></div><span class="stop-state">THE DESTINATION</span></article>
    </section>
    <section class="preview" aria-label="Trip preview"><div class="preview-options" role="group" aria-label="Preview a trip stop"><button data-preview="live" aria-pressed="true">Live</button><button data-preview="nc" aria-pressed="false">In Wilmington</button><button data-preview="flightChicago" aria-pressed="false">✈ Chicago</button><button data-preview="chicago" aria-pressed="false">In Chicago</button><button data-preview="flightCalifornia" aria-pressed="false">✈ California</button><button data-preview="ca" aria-pressed="false">Together ♡</button></div></section>
  </main>
</body>
</html>
